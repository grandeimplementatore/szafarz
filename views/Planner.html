<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#A9442F">
<title>Planner wizyt – Szafarz 3.0</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Szafarz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fondamento&amp;family=Lato:ital,wght@0,400;0,700;0,900;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F0F0F0}
a{color:#BD4F38}a:hover{color:#9A3E2B}
.nav a:hover{background:rgba(0,0,0,.12)}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid #F2B8A9;outline-offset:2px}
@media (max-width: 760px){.pl-os{grid-template-columns:repeat(2,minmax(0,1fr))!important}.pl-cols{grid-template-columns:minmax(0,1fr)!important}}
</style>
</head>
<body>
<template id="tpl">

<div style="background: #F0F0F0; font-family: 'Lato', system-ui, sans-serif; color: #333333; min-height: 100vh">
<div style="background: #A9442F; color: #FFFFFF; font-size: 13px">
<div style="max-width: 1200px; margin: 0 auto; padding: 8px 20px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px">
<span style="font-weight: 700">{{lit.dateLabel}}</span>
<span>Szczęść Boże! · {{lit.dayName}}</span>
</div>
</div>

<header style="background: {{accent}}; color: #FFFFFF">
<div style="max-width: 1200px; margin: 0 auto; padding: 16px 20px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px">
<a href="/" style="flex: 1 1 auto; display: flex; align-items: center; gap: 14px; color: #FFFFFF; text-decoration: none">
<svg aria-hidden="true" width="46" height="52" viewBox="0 0 24 27" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 1v5M9.8 3.2h4.4"></path><path d="M4 26V14a8 8 0 0 1 16 0v12"></path><path d="M9 26v-6a3 3 0 0 1 6 0v6"></path><path d="M2 26h20"></path></svg>
<span style="display: flex; flex-direction: column; gap: 3px">
<span style="font-family: 'Fondamento', Georgia, serif; font-size: clamp(16px, 1.5vw, 20px); line-height: 1.15; white-space: nowrap">Wspólnota Szafarzy Nadzwyczajnych Komunii&nbsp;Świętej</span>
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 16px; line-height: 1.2">Parafia Błogosławionej Karoliny Kózkówny w Tychach</span>
<span style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; opacity: .9">Archidiecezja Katowicka</span>
</span>
</a>
<nav class="nav" aria-label="Menu główne" style="display: flex; flex-wrap: wrap; gap: 4px">
<a href="/Kalendarz" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 44px; padding: 8px 10px; border-radius: 6px; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>Harmonogram</a>
<a href="/Planner" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 44px; padding: 8px 10px; border-radius: 6px; background: rgba(0,0,0,.18); color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18M12 13v5M9.5 15.5h5"></path></svg>Planner</a>
<a href="/Chorzy" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 44px; padding: 8px 10px; border-radius: 6px; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"></path><path d="M5 9.5V20h14V9.5"></path></svg>Nasi Chorzy</a>
<a href="/Obrzed" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 44px; padding: 8px 10px; border-radius: 6px; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="2.6"></circle><path d="M6 9.5h12c0 3.8-2.7 6.3-6 6.3s-6-2.5-6-6.3z"></path><path d="M12 15.8V20M8.5 20.5h7"></path></svg>Obrzęd</a>
<a href="/Wspolnota" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 44px; padding: 8px 10px; border-radius: 6px; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><circle cx="17" cy="9" r="2.6"></circle><path d="M15.6 14.3A5 5 0 0 1 21 19"></path></svg>Nasza Wspólnota</a>
</nav>
</div>
</header>
<section aria-labelledby="tytul" style="position: relative; height: 170px; overflow: hidden; background: #2B3643">
<img src="/img/kosciol.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 40% 55%">
<div style="position: absolute; inset: 0; background: rgba(20,24,30,.55); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #FFFFFF; padding: 0 20px 36px; gap: 6px">
<h1 id="tytul" style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: clamp(34px, 4.4vw, 50px); line-height: 1.05; text-shadow: 0 2px 12px rgba(0,0,0,.5)">Planner wizyt</h1>
<div style="font-size: 15px; text-shadow: 0 1px 6px rgba(0,0,0,.6)">Zaplanuj chorych na najbliższą niedzielę</div>
</div>
</section>
<main style="max-width: 1200px; margin: -36px auto 0; padding: 0 20px 48px; box-sizing: border-box; position: relative">
<div style="background: #FFFFFF; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px">
<nav aria-label="Ścieżka" style="font-size: 13px; color: #5D5D5D"><a href="/">Strona główna</a> › Planner wizyt</nav>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; font-weight: 700"><a href="/Kalendarz">Harmonogram ›</a><a href="/Chorzy">Lista chorych ›</a></div>
</div>

<section aria-labelledby="krok1" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="krok1" style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 26px; color: {{accent}}">1. Niedziela</h2>
<div style="display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px">
<sc-for list="{{dates}}" as="d" hint-placeholder-count="2">
<button type="button" aria-pressed="{{d.selected}}" onClick="{{d.pick}}" style="text-align: left; min-height: 76px; padding: 12px 16px; border: 2px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: {{d.sub2}}">{{d.sub}}</span>
<span style="font-size: 20px; font-weight: 900">{{d.label}}</span>
<span style="font-size: 13px; color: {{d.sub2}}">{{d.total}}</span>
</button>
</sc-for>
</div>
<span style="font-size: 13px; color: #5D5D5D">Planować można tylko najbliższą niedzielę.</span>
</section>

<section aria-labelledby="krok2" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="krok2" style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 26px; color: {{accent}}">2. Wybierz osiedle</h2>
<div class="pl-os" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px">
<sc-for list="{{osCards}}" as="c" hint-placeholder-count="4">
<button type="button" aria-pressed="{{c.selected}}" onClick="{{c.pick}}" style="text-align: left; min-height: 96px; padding: 12px 14px; border: 2px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 26px; font-weight: 900; line-height: 1">{{c.os}}</span>
<span style="font-size: 14px; font-weight: 700">{{c.who}}</span>
<span style="font-size: 13px; color: {{c.sub}}">{{c.cnt}} <span style="font-weight: 700">{{c.foreign}}</span></span>
</button>
</sc-for>
</div>
</section>

<section aria-labelledby="krok3" style="display: flex; flex-direction: column; gap: 14px; border-top: 1px solid #E5E5E5; padding-top: 20px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px">
<h2 id="krok3" style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 26px; color: {{accent}}">3. Chorzy na osiedle {{selOs}} <span style="font-family: 'Lato', sans-serif; font-size: 15px; color: #555555">· {{selDate}} · szafarz: {{selWho}}</span></h2>
<sc-if value="{{locked}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{onUnlock}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 1px solid #003C60; background: #FFFFFF; color: #003C60; font-family: inherit; font-size: 13px; font-weight: 900; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>Odkryj nazwiska</button></sc-if>
<sc-if value="{{unlocked}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{onLock}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 1px solid #BDBDBD; background: #FFFFFF; color: #333333; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>Ukryj nazwiska</button></sc-if>
</div>
<sc-if value="{{asking}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Kod dostępu" style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 10px; padding: 12px 14px; background: #FFF6F3; border: 1px solid #F1D6CE">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="kod-planner-d" style="font-size: 12px; font-weight: 700">Kod dostępu</label>
<input id="kod-planner-d" type="password" inputMode="numeric" autoComplete="off" value="{{code}}" onChange="{{onCode}}" onKeyDown="{{onKeyCode}}" style="width: 120px; min-height: 44px; padding: 0 10px; border: 1px solid #BDBDBD; border-radius: 4px; font-family: inherit; font-size: 18px; letter-spacing: 0.3em"></div>
<button type="button" onClick="{{onSubmitCode}}" style="min-height: 44px; padding: 0 16px; border: 0; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 900; cursor: pointer">Odkryj</button>
<button type="button" onClick="{{onCancelCode}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #BDBDBD; background: #FFFFFF; color: #333333; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Anuluj</button>
<sc-if value="{{err}}" hint-placeholder-val="{{ false }}"><span role="alert" style="flex-basis: 100%; font-size: 13px; font-weight: 700; color: #B3261E">Nieprawidłowy kod.</span></sc-if>
</div>
</sc-if>
<div class="pl-cols" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 8px"><section aria-labelledby="zapl-d" style="display: flex; flex-direction: column; gap: 8px">
<h3 id="zapl-d" style="margin: 0; font-size: 12px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: #3F3F3F">Zaplanowani ({{selCount}})</h3>
<sc-if value="{{noPlanned}}" hint-placeholder-val="{{ false }}"><div style="padding: 16px; border: 1px dashed #C9C9C9; text-align: center; font-size: 14px; color: #555555">Nikt nie jest jeszcze zaplanowany. Dodaj chorych z list poniżej.</div></sc-if>
<sc-for list="{{planned}}" as="p" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #FFFFFF; border: 1px solid #DDDDDD; border-left: 4px solid #2E7D4F">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #E8EEF3; color: #003C60; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8.2" r="4.2"></circle><path d="M3.5 21c.6-4.4 4.1-7.2 8.5-7.2s7.9 2.8 8.5 7.2z"></path></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<sc-if value="{{p.hidden}}" hint-placeholder-val="{{ true }}"><span style="font-size: 18px; font-weight: 900; color: #1A1A1A; filter: blur(3.5px); user-select: none" aria-hidden="true">{{p.nameMasked}}</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Dane ukryte</span></sc-if>
<sc-if value="{{p.shown}}" hint-placeholder-val="{{ false }}"><span style="font-size: 18px; font-weight: 900; color: #1A1A1A">{{p.nameShown}}</span></sc-if>
<span style="font-size: 14px; font-weight: 700; color: #222222">{{p.address}}</span>
<sc-if value="{{p.foreign}}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; font-size: 11px; font-weight: 900; color: #8A4B00; background: #FFF1DC; border: 1px solid #F3C98B; padding: 3px 8px">{{p.foreignLabel}}</span></sc-if>
</div>
<span aria-label="Osiedle {{p.home}}" title="Osiedle {{p.home}}" style="flex: none; min-width: 38px; height: 34px; padding: 0 6px; box-sizing: border-box; border-radius: 6px; background: {{p.badgeBg}}; color: {{p.badgeFg}}; display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 900"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"></path><path d="M5 9.5V20h14V9.5"></path></svg>{{p.home}}</span>
<button type="button" onClick="{{p.remove}}" aria-label="Usuń z planu" style="flex: none; width: 40px; height: 40px; border: 1px solid #DDDDDD; border-radius: 50%; background: #FFFFFF; color: #8A8A8A; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
</sc-for>
</section>

</div><div style="display: flex; flex-direction: column; gap: 8px"><section aria-labelledby="dodaj-d" style="display: flex; flex-direction: column; gap: 8px; padding-top: 6px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px">
<h3 id="dodaj-d" style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #3F3F3F">Chorzy niezaplanowani z osiedla <strong style="font-size: 15px; font-weight: 900; color: #003C60">{{selOs}}</strong></h3>
<sc-if value="{{hasOwn}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{addAllOwn}}" style="min-height: 36px; padding: 0 12px; border: 1px solid {{accent}}; background: #FFFFFF; color: {{accent}}; font-family: inherit; font-size: 13px; font-weight: 900; cursor: pointer">Dodaj wszystkich</button></sc-if>
</div>
<sc-if value="{{ownDone}}" hint-placeholder-val="{{ false }}"><div style="padding: 12px 14px; background: #EEF6F1; font-size: 13px; color: #1F5E3A">Wszyscy chorzy z tego osiedla są już zaplanowani.</div></sc-if>
<sc-for list="{{own}}" as="p" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #FAFAFA; border: 1px solid #E5E5E5">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #E8EEF3; color: #003C60; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8.2" r="4.2"></circle><path d="M3.5 21c.6-4.4 4.1-7.2 8.5-7.2s7.9 2.8 8.5 7.2z"></path></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<sc-if value="{{p.hidden}}" hint-placeholder-val="{{ true }}"><span style="font-size: 18px; font-weight: 900; color: #1A1A1A; filter: blur(3.5px); user-select: none" aria-hidden="true">{{p.nameMasked}}</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Dane ukryte</span></sc-if>
<sc-if value="{{p.shown}}" hint-placeholder-val="{{ false }}"><span style="font-size: 18px; font-weight: 900; color: #1A1A1A">{{p.nameShown}}</span></sc-if>
<span style="font-size: 14px; font-weight: 700; color: #222222">{{p.address}}</span>
</div>
<span aria-label="Osiedle {{p.home}}" title="Osiedle {{p.home}}" style="flex: none; min-width: 38px; height: 34px; padding: 0 6px; box-sizing: border-box; border-radius: 6px; background: {{p.badgeBg}}; color: {{p.badgeFg}}; display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 900"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"></path><path d="M5 9.5V20h14V9.5"></path></svg>{{p.home}}</span>
<button type="button" onClick="{{p.add}}" aria-label="Dodaj do planu" style="flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</sc-for>
<sc-for list="{{ownElsewhere}}" as="p" hint-placeholder-count="0">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #FAFAFA; border: 1px dashed #C9C9C9">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #E8EEF3; color: #003C60; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8.2" r="4.2"></circle><path d="M3.5 21c.6-4.4 4.1-7.2 8.5-7.2s7.9 2.8 8.5 7.2z"></path></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<sc-if value="{{p.hidden}}" hint-placeholder-val="{{ true }}"><span style="font-size: 18px; font-weight: 900; color: #1A1A1A; filter: blur(3.5px); user-select: none" aria-hidden="true">{{p.nameMasked}}</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Dane ukryte</span></sc-if>
<sc-if value="{{p.shown}}" hint-placeholder-val="{{ false }}"><span style="font-size: 18px; font-weight: 900; color: #1A1A1A">{{p.nameShown}}</span></sc-if>
<span style="font-size: 14px; font-weight: 700; color: #222222">{{p.address}}</span>
<span style="font-size: 12px; font-weight: 700; color: #003C60">{{p.where}}</span>
</div>
<span aria-label="Osiedle {{p.home}}" title="Osiedle {{p.home}}" style="flex: none; min-width: 38px; height: 34px; padding: 0 6px; box-sizing: border-box; border-radius: 6px; background: {{p.badgeBg}}; color: {{p.badgeFg}}; display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 900"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"></path><path d="M5 9.5V20h14V9.5"></path></svg>{{p.home}}</span>
<button type="button" onClick="{{p.move}}" style="flex: none; min-height: 40px; padding: 0 10px; border: 1px solid #003C60; background: #FFFFFF; color: #003C60; font-family: inherit; font-size: 12px; font-weight: 900; cursor: pointer">Przenieś</button>
</div>

  dayName: name, dayColor: color,
  hasQuote: !!r, noQuote: !r,
  quote: r ? '„' + r[0] + '”' : '', quoteRef: r ? r[1] : '',

  dayShort: D + ' ' + GEN[M - 1]

};
class Component extends DCLogic {

const accent = this.props.accent ?? '#BD4F38';

const OS = SZ.ref.osiedla;

const T = SZ.ref.harmonogram;
const SICK0 = [];
const WD = ['niedz.','pon.','wt.','śr.','czw.','pt.','sob.'];
const WDF = ['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'];

const fmtLong = (iso) => { const d = parse(iso); return WDF[d.wd] + ', ' + d.d + ' ' + GEN[d.m - 1]; };
const chorych = (n) => n + ' ' + (n === 1 ? 'chory' : 'chorych');

SUNDAYS.forEach((iso) => { if (!db.plan[iso]) { db.plan[iso] = {}; } OS.forEach((o) => { if (!db.plan[iso][o]) db.plan[iso][o] = []; }); });
const SICK = SICK0.concat(db.added || []).filter((s) => (db.removed || []).indexOf(s.id) < 0).map((s) => Object.assign({}, s, (db.edits || {})[s.id] || {}));

const on = iso === selIso;
const total = OS.reduce((a, o) => a + plannedCount(iso, o), 0);
return { label: fmtLong(iso), sub: k === 0 ? 'najbliższa niedziela' : 'kolejna niedziela', total: total ? 'zaplanowano: ' + total : 'nic nie zaplanowano', selected: on ? 'true' : 'false', bg: on ? '#003C60' : '#FFFFFF', fg: on ? '#FFFFFF' : '#222222', sub2: on ? 'rgba(255,255,255,.85)' : '#5D5D5D', border: on ? '#003C60' : '#C9C9C9', pick: () => this.setState({ iso, others: false }) };
