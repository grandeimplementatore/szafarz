<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#A9442F">
<title>Obrzęd Komunii Świętej – Szafarz 3.0</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Szafarz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fondamento&amp;family=Lato:ital,wght@0,400;0,700;0,900;1,400&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#BD4F38}a:hover{color:#9A3E2B}
button:focus-visible,a:focus-visible{outline:3px solid #F2B8A9;outline-offset:2px}
</style>
</head>
<body>
<template id="tpl">

<div style="width: 100%; max-width: 640px; margin: 0 auto; height: 100vh; height: 100dvh; box-sizing: border-box; background: #F0F0F0; font-family: 'Lato', system-ui, sans-serif; color: #333333; display: flex; flex-direction: column; overflow: hidden">
<header style="flex: none; background: {{accent}}; color: #FFFFFF; padding: 10px 12px; display: flex; align-items: center; gap: 8px">
<a href="/Telefon" aria-label="Wróć do strony głównej" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; border-radius: 6px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 21px; line-height: 1.1">Obrzęd Komunii</span>
<span style="font-size: 11px; opacity: .92">Komunia chorych · nadzwyczajny szafarz</span>
</div>
<button type="button" onClick="{{toggleBig}}" aria-pressed="{{bigPressed}}" aria-label="Większy tekst modlitw" style="flex: none; width: 48px; height: 44px; border: 1px solid rgba(255,255,255,.6); border-radius: 6px; background: {{bigBg}}; color: {{bigFg}}; font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; font-weight: 400; cursor: pointer; padding: 0">A<span style="font-size: 13px">A</span></button>
</header>
<div style="flex: none; background: #FFFFFF; padding: 10px 12px; border-bottom: 1px solid #DDDDDD">
<div role="tablist" aria-label="Rodzaj obrzędu" style="display: flex; gap: 6px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="flex: 1; min-height: 40px; padding: 0 6px; border-radius: 999px; font-size: 13px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-weight: 700; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
</div>
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px">
<a href="/ObrzedKroki" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; padding: 0 16px; background: #003C60; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 900"><span>Prowadź mnie krok po kroku</span><span aria-hidden="true">›</span></a>
<section style="background: #FFFFFF; padding: 4px 16px 8px">
<h2 style="margin: 14px 0 4px; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 21px; line-height: 1.2; color: {{accent}}">{{riteTitle}}</h2>
<sc-if value="{{hasIntro}}" hint-placeholder-val="{{ false }}"><p style="margin: 4px 0; font-size: 14px; line-height: 1.55; font-style: italic; color: #9A3E2B">{{intro}}</p></sc-if>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
<li style="display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid #E5E5E5">
<span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 50%; border: 2px solid {{accent}}; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px">{{s.n}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: #5D5D5D">{{s.section}}</span>
<h3 style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 21px; color: #222222">{{s.title}}</h3>
</div>
<sc-for list="{{s.blocks}}" as="b" hint-placeholder-count="3">
<sc-if value="{{b.isR}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 14px; line-height: 1.55; font-style: italic; color: #9A3E2B">{{b.text}}</p></sc-if>
<sc-if value="{{b.isAlt}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 900; color: #9A3E2B"><span style="flex: 1; height: 1px; background: #E8CFC8"></span>{{b.text}}<span style="flex: 1; height: 1px; background: #E8CFC8"></span></div></sc-if>
<sc-if value="{{b.isRef}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; font-weight: 900; color: #003C60; margin-top: 4px">{{b.text}}</span></sc-if>
<sc-if value="{{b.isLine}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 2px"><sc-if value="{{b.hasWho}}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: {{b.whoColor}}">{{b.who}}</span></sc-if><span style="font-family: 'Source Serif 4', Georgia, serif; font-size: {{b.size}}; line-height: 1.5; white-space: pre-line; color: #1E1E1E">{{b.text}}</span></div></sc-if>
</sc-for>
</div>
</li>
</sc-for>
</ol>
</section>
<section aria-labelledby="przyg-m" style="background: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<h2 id="przyg-m" style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 18px; text-transform: uppercase; letter-spacing: 0.03em; color: #3F3F3F">Przygotowanie do wizyty</h2>
<div style="background: #F5F5F5; padding: 10px 12px; font-size: 13px; line-height: 1.5">Komunię do burs nakłada na ołtarzu szafarz oznaczony w harmonogramie gwiazdką (*) przy Mszy o 7:30.</div>
<ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.5"><li>Idź prosto do chorego i zachowaj skupienie po drodze.</li><li>Poproś domowników o stół nakryty białym obrusem, z krzyżem, świecą i naczyniem z wodą do obmycia palców.</li><li>Weź bursę z Najświętszym Sakramentem, korporał i tekst obrzędu.</li><li>Gdy chory ma trudność z przyjęciem całej Hostii, można podać małą cząstkę.</li></ul>
<span style="font-size: 11px; font-style: italic; color: #5D5D5D">Dobre praktyki do potwierdzenia z ks. opiekunem.</span>
</section>
<p style="margin: 0 0 8px; font-size: 11px; color: #5D5D5D; text-align: center">Układ wg nszafarze.pl · tekst wg nszafarze.pl</p>
</div>
</div>
</template>
<div id="root"></div>
<script src="/runtime.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#BD4F38';
const RITES = SZ.ref.obrzedy;
const st = this.state || {};
const cur = st.rite || 'zwykly';
const big = !!st.big;
const WHO = { S: 'Szafarz', W: 'Wszyscy', Ch: 'Chory', P: 'Przyjmujący Komunię' };
const blk = (b) => ({ isR: b.t === 'r', isAlt: b.t === 'alt', isRef: b.t === 'ref', isLine: b.t === 'l', text: b.x || '', who: WHO[b.w] || '', hasWho: !!WHO[b.w], whoColor: b.w === 'S' ? accent : '#003C60', size: big ? '22px' : '17px' });
const r = RITES.find((x) => x.id === cur) || RITES[0];
const tabs = RITES.map((x) => {
const on = x.id === cur;
return { label: x.short, selected: on ? 'true' : 'false', bg: on ? accent : '#FFFFFF', fg: on ? '#FFFFFF' : '#333333', border: on ? accent : '#C9C9C9', pick: () => this.setState({ rite: x.id }) };
});
const steps = r.steps.map((s, i) => ({ n: String(i + 1), section: s.sec, title: s.title, blocks: s.b.map(blk) }));
return {
accent,
tabs,
steps,
intro: r.intro,
hasIntro: !!r.intro,
riteTitle: r.title,
bigPressed: big ? 'true' : 'false',
bigBg: big ? '#FFFFFF' : 'transparent',
bigFg: big ? accent : '#FFFFFF',
toggleBig: () => this.setState({ big: !big })
};
}
}
SZ.mount(Component, {"mobile":null,"desktop":"/Obrzed"});
</script>
</body>
</html>
