<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#A9442F">
<title>Ustawienia – Szafarz 3.0</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Szafarz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fondamento&amp;family=Lato:ital,wght@0,400;0,700;0,900;1,400&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#BD4F38}a:hover{color:#9A3E2B}
</style>
</head>
<body>
<template id="tpl">

<div style="width: 100%; max-width: 640px; margin: 0 auto; height: 100vh; height: 100dvh; box-sizing: border-box; background: #F0F0F0; font-family: 'Lato', system-ui, sans-serif; color: #333333; display: flex; flex-direction: column; overflow: hidden">
<header style="flex: none; background: {{accent}}; color: #FFFFFF; padding: 10px 12px; display: flex; align-items: center; gap: 8px">
<a href="/Telefon" aria-label="Wróć do strony głównej" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; border-radius: 6px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 22px; line-height: 1.1">Ustawienia</span>
<span style="font-size: 11px; opacity: .92">Szafarze, osiedla, harmonogram</span>
</div>
</header>
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 20px">
<sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 15px; color: #555555">Wczytywanie…</p></sc-if>
<sc-if value="{{msg}}" hint-placeholder-val="{{ false }}"><div role="status" style="padding: 10px 12px; background: #EEF6F1; border: 1px solid #BFDCCB; font-size: 14px; font-weight: 700; color: #1F5E3A">{{msg}}</div></sc-if>
<sc-if value="{{err}}" hint-placeholder-val="{{ false }}"><div role="alert" style="padding: 10px 12px; background: #FFF6F3; border: 1px solid #F1D6CE; font-size: 14px; font-weight: 700; color: #8C3524">{{err}}</div></sc-if>
<sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; align-items: start">

<section aria-labelledby="h-sz" style="background: #FFFFFF; border: 1px solid #DDDDDD; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0">
<h2 id="h-sz" style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 22px; color: {{accent}}">Szafarze ({{szCount}})</h2>
<ul style="margin: 0; padding: 0; list-style: none">
<sc-for list="{{szafarze}}" as="s" hint-placeholder-count="4"><li style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 0; border-bottom: 1px solid #EEEEEE"><span style="flex: 1 1 150px; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 900; color: #222222">{{s.label}}</span><span style="font-size: 13px; color: #5D5D5D">{{s.info}}</span></span>
<sc-if value="{{s.idle}}" hint-placeholder-val="{{ true }}"><span style="display: flex; gap: 6px"><button type="button" onClick="{{s.edit}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 1px solid #9FB4C7; background: #FFFFFF; color: #003C60; font-weight: 700">Zmień</button><button type="button" onClick="{{s.ask}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 1px solid #E3B5AE; background: #FFFFFF; color: #B3261E; font-weight: 700">Usuń</button></span></sc-if>
<sc-if value="{{s.confirm}}" hint-placeholder-val="{{ false }}"><div role="alertdialog" aria-label="Potwierdź usunięcie" style="flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; background: #FFF6F3; border: 1px solid #F1D6CE"><span style="flex: 1 1 220px; font-size: 14px; font-weight: 700; color: #8C3524">{{s.question}}</span><sc-if value="{{s.canYes}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{s.yes}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 0; background: #B3261E; color: #FFFFFF; font-weight: 900">Tak, usuń</button></sc-if><button type="button" onClick="{{s.no}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 1px solid #BDBDBD; background: #FFFFFF; color: #333333; font-weight: 700">Anuluj</button></div></sc-if>
<sc-if value="{{s.editing}}" hint-placeholder-val="{{ false }}"><div role="group" aria-label="Zmień dane szafarza" style="flex-basis: 100%; display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #F3F6F9; border: 1px solid #D5DEE7"><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3F3F3F">Nazwisko *<input id="{{s.eid}}-n" value="{{s.eNazw}}" onChange="{{s.onENazw}}" autoComplete="off" style="min-height: 44px; padding: 0 10px; border: 1px solid #BDBDBD; border-radius: 4px; font-family: inherit; font-size: 15px; color: #222222; width: 100%; box-sizing: border-box; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3F3F3F">Imię<input id="{{s.eid}}-i" value="{{s.eImie}}" onChange="{{s.onEImie}}" autoComplete="off" style="min-height: 44px; padding: 0 10px; border: 1px solid #BDBDBD; border-radius: 4px; font-family: inherit; font-size: 15px; color: #222222; width: 100%; box-sizing: border-box; background: #FFFFFF"></label></div>
<div style="display: flex; gap: 8px"><button type="button" onClick="{{s.save}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 0; background: {{accent}}; color: #FFFFFF; font-weight: 900">Zapisz</button><button type="button" onClick="{{s.cancelEdit}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 1px solid #BDBDBD; background: #FFFFFF; color: #333333; font-weight: 700">Anuluj</button></div></div></sc-if></li></sc-for>
</ul>
<div role="group" aria-label="Dodaj szafarza" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #F7F7F7">
<span style="font-size: 12px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: #3F3F3F">Dodaj szafarza</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3F3F3F">Nazwisko *<input id="ust-sz-nazw" value="{{fNazw}}" onChange="{{onNazw}}" onKeyDown="{{keySz}}" autoComplete="off" style="min-height: 44px; padding: 0 10px; border: 1px solid #BDBDBD; border-radius: 4px; font-family: inherit; font-size: 15px; color: #222222; width: 100%; box-sizing: border-box; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3F3F3F">Imię<input id="ust-sz-imie" value="{{fImie}}" onChange="{{onImie}}" onKeyDown="{{keySz}}" autoComplete="off" style="min-height: 44px; padding: 0 10px; border: 1px solid #BDBDBD; border-radius: 4px; font-family: inherit; font-size: 15px; color: #222222; width: 100%; box-sizing: border-box; background: #FFFFFF"></label>
</div>
<button type="button" onClick="{{addSz}}" style="min-height: 44px; padding: 0 18px; border: 0; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 900; cursor: pointer">Dodaj szafarza</button>
</div>
</section>

<section aria-labelledby="h-os" style="background: #FFFFFF; border: 1px solid #DDDDDD; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0">
<h2 id="h-os" style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 22px; color: {{accent}}">Osiedla ({{osCount}})</h2>
<ul style="margin: 0; padding: 0; list-style: none">
<sc-for list="{{osiedla}}" as="o" hint-placeholder-count="4"><li style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 0; border-bottom: 1px solid #EEEEEE"><span aria-hidden="true" style="flex: none; min-width: 44px; height: 36px; padding: 0 6px; box-sizing: border-box; background: #003C60; color: #FFFFFF; font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center">{{o.kod}}</span><span style="flex: 1 1 130px; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 900; color: #222222">{{o.nazwa}}</span><span style="font-size: 13px; color: #5D5D5D">{{o.info}}</span></span>
<sc-if value="{{o.idle}}" hint-placeholder-val="{{ true }}"><span style="display: flex; gap: 6px"><button type="button" onClick="{{o.edit}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 1px solid #9FB4C7; background: #FFFFFF; color: #003C60; font-weight: 700">Zmień</button><button type="button" onClick="{{o.ask}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 1px solid #E3B5AE; background: #FFFFFF; color: #B3261E; font-weight: 700">Usuń</button></span></sc-if>
<sc-if value="{{o.confirm}}" hint-placeholder-val="{{ false }}"><div role="alertdialog" aria-label="Potwierdź usunięcie" style="flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; background: #FFF6F3; border: 1px solid #F1D6CE"><span style="flex: 1 1 220px; font-size: 14px; font-weight: 700; color: #8C3524">{{o.question}}</span><sc-if value="{{o.canYes}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{o.yes}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 0; background: #B3261E; color: #FFFFFF; font-weight: 900">Tak, usuń</button></sc-if><button type="button" onClick="{{o.no}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 1px solid #BDBDBD; background: #FFFFFF; color: #333333; font-weight: 700">Anuluj</button></div></sc-if>
<sc-if value="{{o.editing}}" hint-placeholder-val="{{ false }}"><div role="group" aria-label="Zmień osiedle" style="flex-basis: 100%; display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #F3F6F9; border: 1px solid #D5DEE7"><div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3F3F3F">Kod *<input id="{{o.eid}}-k" value="{{o.eKod}}" onChange="{{o.onEKod}}" maxLength="4" autoComplete="off" style="min-height: 44px; padding: 0 10px; border: 1px solid #BDBDBD; border-radius: 4px; font-family: inherit; font-size: 15px; color: #222222; width: 100%; box-sizing: border-box; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3F3F3F">Nazwa<input id="{{o.eid}}-n" value="{{o.eNazwa}}" onChange="{{o.onENazwa}}" autoComplete="off" style="min-height: 44px; padding: 0 10px; border: 1px solid #BDBDBD; border-radius: 4px; font-family: inherit; font-size: 15px; color: #222222; width: 100%; box-sizing: border-box; background: #FFFFFF"></label></div>
<span style="font-size: 12px; color: #555555">Zmiana kodu przenosi chorych, wizyty i przydziały na nowy kod.</span>
<div style="display: flex; gap: 8px"><button type="button" onClick="{{o.save}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 0; background: {{accent}}; color: #FFFFFF; font-weight: 900">Zapisz</button><button type="button" onClick="{{o.cancelEdit}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 1px solid #BDBDBD; background: #FFFFFF; color: #333333; font-weight: 700">Anuluj</button></div></div></sc-if></li></sc-for>
</ul>
<div role="group" aria-label="Dodaj osiedle" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #F7F7F7">
<span style="font-size: 12px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: #3F3F3F">Dodaj osiedle</span>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3F3F3F">Kod *<input id="ust-os-kod" value="{{fKod}}" onChange="{{onKod}}" onKeyDown="{{keyOs}}" placeholder="np. P" maxLength="4" autoComplete="off" style="min-height: 44px; padding: 0 10px; border: 1px solid #BDBDBD; border-radius: 4px; font-family: inherit; font-size: 15px; color: #222222; width: 100%; box-sizing: border-box; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3F3F3F">Nazwa<input id="ust-os-nazwa" value="{{fONazwa}}" onChange="{{onONazwa}}" onKeyDown="{{keyOs}}" placeholder="np. Osiedle P" autoComplete="off" style="min-height: 44px; padding: 0 10px; border: 1px solid #BDBDBD; border-radius: 4px; font-family: inherit; font-size: 15px; color: #222222; width: 100%; box-sizing: border-box; background: #FFFFFF"></label>
</div>
<button type="button" onClick="{{addOs}}" style="min-height: 44px; padding: 0 18px; border: 0; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 900; cursor: pointer">Dodaj osiedle</button>
</div>
</section>
</div>

<section aria-labelledby="h-t" style="background: #FFFFFF; border: 1px solid #DDDDDD; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 id="h-t" style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 22px; color: {{accent}}">Harmonogram wizyt ({{tCount}})</h2>
<sc-if value="{{hasPast}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{togglePast}}" style="border: 0; background: transparent; color: {{accent}}; font-family: inherit; font-size: 14px; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0">{{pastToggle}}</button></sc-if>
</div>
<div role="group" aria-label="Dodaj termin" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #F7F7F7">
<span style="font-size: 12px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: #3F3F3F">Dodaj termin</span>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3F3F3F">Data *<input id="ust-t-data" type="date" value="{{fTData}}" onChange="{{onTData}}" style="min-height: 44px; padding: 0 10px; border: 1px solid #BDBDBD; border-radius: 4px; font-family: inherit; font-size: 15px; color: #222222; width: 100%; box-sizing: border-box; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3F3F3F">Nazwa dnia *<input id="ust-t-nazwa" value="{{fTNazwa}}" onChange="{{onTNazwa}}" onKeyDown="{{keyT}}" placeholder="np. II Niedziela Adwentu" autoComplete="off" style="min-height: 44px; padding: 0 10px; border: 1px solid #BDBDBD; border-radius: 4px; font-family: inherit; font-size: 15px; color: #222222; width: 100%; box-sizing: border-box; background: #FFFFFF"></label>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px">
<sc-for list="{{selects}}" as="x" hint-placeholder-count="4"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3F3F3F">Osiedle {{x.os}} *<sc-select id="{{x.id}}" value="{{x.value}}" onChange="{{x.onChange}}" style="min-height: 44px; padding: 0 10px; border: 1px solid #BDBDBD; border-radius: 4px; font-family: inherit; font-size: 15px; color: #222222; width: 100%; box-sizing: border-box; background: #FFFFFF"><sc-option value="">— wybierz —</sc-option><sc-for list="{{x.options}}" as="n" hint-placeholder-count="3"><sc-option value="{{n}}">{{n}}</sc-option></sc-for></sc-select></label></sc-for>
</div>
<button type="button" onClick="{{addT}}" style="min-height: 44px; padding: 0 18px; border: 0; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 900; cursor: pointer">Dodaj termin</button>
</div>
<sc-if value="{{noTerms}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 14px; border: 1px dashed #C9C9C9; text-align: center; font-size: 14px; color: #555555">Brak nadchodzących terminów.</p></sc-if>
<ul style="margin: 0; padding: 0; list-style: none">
<sc-for list="{{terminy}}" as="t" hint-placeholder-count="5"><li style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 0; border-bottom: 1px solid #EEEEEE; opacity: {{t.op}}"><span style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 900; color: #222222">{{t.date}} <span style="font-weight: 400; color: #555555">· {{t.nazwa}}</span></span><span style="font-size: 13px; color: #333333">{{t.who}}</span></span>
<sc-if value="{{t.idle}}" hint-placeholder-val="{{ true }}"><span style="display: flex; gap: 6px"><button type="button" onClick="{{t.edit}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 1px solid #9FB4C7; background: #FFFFFF; color: #003C60; font-weight: 700">Zmień</button><button type="button" onClick="{{t.ask}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 1px solid #E3B5AE; background: #FFFFFF; color: #B3261E; font-weight: 700">Usuń</button></span></sc-if>
<sc-if value="{{t.confirm}}" hint-placeholder-val="{{ false }}"><div role="alertdialog" aria-label="Potwierdź usunięcie" style="flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; background: #FFF6F3; border: 1px solid #F1D6CE"><span style="flex: 1 1 220px; font-size: 14px; font-weight: 700; color: #8C3524">{{t.question}}</span><sc-if value="{{t.canYes}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{t.yes}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 0; background: #B3261E; color: #FFFFFF; font-weight: 900">Tak, usuń</button></sc-if><button type="button" onClick="{{t.no}}" style="min-height: 36px; min-width: 72px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; border: 1px solid #BDBDBD; background: #FFFFFF; color: #333333; font-weight: 700">Anuluj</button></div></sc-if>
<sc-if value="{{t.editing}}" hint-placeholder-val="{{ false }}"><div role="group" aria-label="Zmień termin" style="flex-basis: 100%; display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #F3F6F9; border: 1px solid #D5DEE7">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3F3F3F">Data *<input id="{{t.eid}}-d" type="date" value="{{t.eData}}" onChange="{{t.onEData}}" style="min-height: 44px; padding: 0 10px; border: 1px solid #BDBDBD; border-radius: 4px; font-family: inherit; font-size: 15px; color: #222222; width: 100%; box-sizing: border-box; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3F3F3F">Nazwa dnia *<input id="{{t.eid}}-n" value="{{t.eNazwa}}" onChange="{{t.onENazwa}}" autoComplete="off" style="min-height: 44px; padding: 0 10px; border: 1px solid #BDBDBD; border-radius: 4px; font-family: inherit; font-size: 15px; color: #222222; width: 100%; box-sizing: border-box; background: #FFFFFF"></label>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px">
<sc-for list="{{t.eSelects}}" as="x" hint-placeholder-count="4"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #3F3F3F">Osiedle {{x.os}} *<sc-select id="{{x.id}}" value="{{x.value}}" onChange="{{x.onChange}}" style="min-height: 44px; padding: 0 10px; border: 1px solid #BDBDBD; border-radius: 4px; font-family: inherit; font-size: 15px; color: #222222; width: 100%; box-sizing: border-box; background: #FFFFFF"><sc-option value="">— wybierz —</sc-option><sc-for list="{{x.options}}" as="n" hint-placeholder-count="3"><sc-option value="{{n}}">{{n}}</sc-option></sc-for></sc-select></label></sc-for>
</div>
<span style="font-size: 12px; color: #555555">Zmiana szafarza zapisuje się w historii zmian harmonogramu.</span>
