<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#A9442F">
<title>Obrzęd krok po kroku – Szafarz 3.0</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Szafarz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fondamento&amp;family=Lato:ital,wght@0,400;0,700;0,900;1,400&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#BD4F38}a:hover{color:#9A3E2B}
button:focus-visible,a:focus-visible{outline:3px solid #F2B8A9;outline-offset:2px}
</style>
</head>
<body>
<template id="tpl">

<div style="width: 100%; max-width: 640px; margin: 0 auto; height: 100vh; height: 100dvh; box-sizing: border-box; background: #F0F0F0; font-family: 'Lato', system-ui, sans-serif; color: #333333; display: flex; flex-direction: column; overflow: hidden">

<header style="flex: none; background: {{accent}}; color: #FFFFFF; padding: 10px 12px; display: flex; align-items: center; gap: 8px">
<a href="/ObrzedTelefon" aria-label="Zamknij tryb krok po kroku" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; border-radius: 6px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 21px; line-height: 1.1">{{headTitle}}</span>
<span style="font-size: 11px; opacity: .92">Obrzęd krok po kroku</span>
</div>
<button type="button" onClick="{{toggleBig}}" aria-pressed="{{bigPressed}}" aria-label="Większy tekst modlitw" style="flex: none; width: 48px; height: 44px; border: 1px solid rgba(255,255,255,.6); border-radius: 6px; background: {{bigBg}}; color: {{bigFg}}; font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; cursor: pointer; padding: 0">A<span style="font-size: 13px">A</span></button>
</header>

<sc-if value="{{isStart}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 26px; color: #222222">Który obrzęd?</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #555555">Wybierz obrzęd. Aplikacja poprowadzi Cię przez kolejne kroki – jeden krok na ekranie.</p>
<sc-for list="{{riteCards}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" style="text-align: left; background: #FFFFFF; border: 1px solid #DDDDDD; border-left: 5px solid {{accent}}; padding: 16px; display: flex; flex-direction: column; gap: 6px; font-family: inherit; color: #333333; cursor: pointer">
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%"><span style="font-family: 'Fondamento', Georgia, serif; font-size: 22px; color: #222222">{{c.title}}</span><span style="font-size: 12px; font-weight: 700; color: #5D5D5D">{{c.count}}</span></span>
<span style="font-size: 13px; line-height: 1.5; color: #555555">{{c.intro}}</span>
<span style="font-size: 14px; font-weight: 900; color: {{accent}}">Rozpocznij ›</span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isStep}}" hint-placeholder-val="{{ false }}">
<div style="flex: none; background: #FFFFFF; padding: 10px 14px 12px; border-bottom: 1px solid #DDDDDD; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 13px"><span style="font-weight: 900; color: #222222">Krok {{stepNo}} z {{stepTotal}}</span><span style="color: #5D5D5D">Dalej: {{nextTitle}}</span></div>
<div style="display: flex; gap: 4px">
<sc-for list="{{segs}}" as="g" hint-placeholder-count="8">
<button type="button" onClick="{{g.pick}}" aria-label="{{g.aria}}" aria-current="{{g.current}}" style="flex: 1; height: 24px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center"><span style="display: block; width: 100%; height: {{g.h}}; border-radius: 3px; background: {{g.bg}}"></span></button>
</sc-for>
</div>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px">{{stepNo}}</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: #5D5D5D">{{cur.section}}</span>
<h2 style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.1; color: #222222">{{cur.title}}</h2>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{cur.blocks}}" as="b" hint-placeholder-count="3">
<sc-if value="{{b.isR}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 15px; line-height: 1.55; font-style: italic; color: #9A3E2B">{{b.text}}</p></sc-if>
<sc-if value="{{b.isAlt}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 900; color: #9A3E2B"><span style="flex: 1; height: 1px; background: #E8CFC8"></span>{{b.text}}<span style="flex: 1; height: 1px; background: #E8CFC8"></span></div></sc-if>
<sc-if value="{{b.isRef}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; font-weight: 900; color: #003C60; margin-top: 4px">{{b.text}}</span></sc-if>
<sc-if value="{{b.isLine}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 2px"><sc-if value="{{b.hasWho}}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: {{b.whoColor}}">{{b.who}}</span></sc-if><span style="font-family: 'Source Serif 4', Georgia, serif; font-size: {{b.size}}; line-height: 1.5; white-space: pre-line; color: #1E1E1E">{{b.text}}</span></div></sc-if>
</sc-for>
</div>
</div>

<nav aria-label="Nawigacja kroków" style="flex: none; background: #FFFFFF; border-top: 1px solid #DDDDDD; padding: 10px 12px 14px; display: flex; gap: 10px">
<button type="button" onClick="{{goBack}}" style="flex: 1; min-height: 54px; border: 1px solid #BDBDBD; background: #FFFFFF; color: #333333; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">‹ {{backLabel}}</button>
<button type="button" onClick="{{goNext}}" style="flex: 1; min-height: 54px; border: 0; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 900; cursor: pointer">{{nextLabel}} ›</button>
</nav>
</sc-if>

<sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; background: #FFFFFF">
<svg aria-hidden="true" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#2E7D4F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><path d="M7.5 12.5l3 3 6-6.5"></path></svg>
<h2 style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 28px; color: #222222">Obrzęd zakończony</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #555555">{{doneText}}</p>
<a href="/PlannerTelefon" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; width: 100%; max-width: 300px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 900; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18M12 13v5M9.5 15.5h5"></path></svg>Zaplanuj wizytę</a>
<a href="/Telefon" style="display: flex; align-items: center; justify-content: center; min-height: 50px; width: 100%; max-width: 300px; border: 1px solid #BDBDBD; background: #FFFFFF; color: #333333; font-size: 15px; font-weight: 700; text-decoration: none">Przejdź do Strony głównej</a>
</div>
</sc-if>

</div>
</template>
<div id="root"></div>
<script src="/runtime.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#BD4F38';
const RITES = SZ.ref.obrzedy;
const st = this.state || {};
const riteId = st.rite || null;
const i = st.step || 0;
const done = !!st.done;
const big = !!st.big;
const WHO = { S: 'Szafarz', W: 'Wszyscy', Ch: 'Chory', P: 'Przyjmujący Komunię' };
const blk = (b) => ({ isR: b.t === 'r', isAlt: b.t === 'alt', isRef: b.t === 'ref', isLine: b.t === 'l', text: b.x || '', who: WHO[b.w] || '', hasWho: !!WHO[b.w], whoColor: b.w === 'S' ? accent : '#003C60', size: big ? '25px' : '20px' });
const r = RITES.find((x) => x.id === riteId) || null;
const n = r ? r.steps.length : 0;
const go = (k) => this.setState({ step: Math.max(0, Math.min(n - 1, k)) });
const riteCards = RITES.map((x) => ({ title: x.tab, intro: x.intro || x.title, count: x.steps.length + ' kroków', pick: () => this.setState({ rite: x.id, step: 0, done: false }) }));
let cur = { section: '', title: '', blocks: [] };
let segs = [];
if (r) {
const s = r.steps[i];
cur = { section: s.sec, title: s.title, blocks: s.b.map(blk) };
segs = r.steps.map((x, k) => ({ aria: 'Krok ' + (k + 1) + ': ' + x.title, current: k === i ? 'step' : 'false', bg: k <= i ? accent : '#DDDDDD', h: k === i ? '10px' : '6px', pick: () => go(k) }));
}
const last = i >= n - 1;
return {
accent,
headTitle: r ? r.tab : 'Obrzęd Komunii',
isStart: !r,
isStep: !!r && !done,
isDone: !!r && done,
riteCards,
cur,
segs,
stepNo: String(i + 1),
stepTotal: String(n),
nextTitle: r ? (last ? 'zakończenie obrzędu' : r.steps[i + 1].title) : '',
backLabel: i === 0 ? 'Zmień obrzęd' : 'Wstecz',
nextLabel: last ? 'Zakończ' : 'Dalej',
isLast: !!r && last,
notLast: !(!!r && last),
goBack: () => (i === 0 ? this.setState({ rite: null, step: 0 }) : go(i - 1)),
goNext: () => (last ? this.setState({ done: true }) : go(i + 1)),
doneText: r ? 'Ukończono: ' + r.tab.toLowerCase() + '. Niech Pan wynagrodzi Twoją posługę.' : '',
restart: () => this.setState({ rite: null, step: 0, done: false }),
again: () => this.setState({ step: 0, done: false }),
bigPressed: big ? 'true' : 'false',
bigBg: big ? '#FFFFFF' : 'transparent',
bigFg: big ? accent : '#FFFFFF',
toggleBig: () => this.setState({ big: !big })
};
}
}
SZ.mount(Component, {"mobile":null,"desktop":null});
</script>
</body>
</html>
