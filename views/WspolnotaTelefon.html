<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#A9442F">
<title>Nasza Wspólnota – Szafarz 3.0</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Szafarz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fondamento&amp;family=Lato:ital,wght@0,400;0,700;0,900;1,400&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#BD4F38}a:hover{color:#9A3E2B}
</style>
</head>
<body>
<template id="tpl">

<div style="width: 100%; max-width: 640px; margin: 0 auto; height: 100vh; height: 100dvh; box-sizing: border-box; background: #F0F0F0; font-family: 'Lato', system-ui, sans-serif; color: #333333; display: flex; flex-direction: column; overflow: hidden">
<header style="flex: none; background: {{accent}}; color: #FFFFFF; padding: 10px 12px; display: flex; align-items: center; gap: 8px">
<a href="/Telefon" aria-label="Wróć do strony głównej" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; border-radius: 6px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 22px; line-height: 1.1">Nasza wspólnota</span>
<span style="font-size: 11px; opacity: .92">Szafarze Nadzwyczajni Komunii&nbsp;Świętej</span>
</div>
</header>
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px">
<section aria-labelledby="o-nas-m" style="background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<h2 id="o-nas-m" style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 24px; color: {{accent}}">O nas</h2>
<p style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; line-height: 1.5; color: #2A2A2A">{{ref.wspolnota.wstep}}</p>
<sc-for list="{{ref.wspolnota.akapity}}" as="a" hint-placeholder-count="2"><p style="margin: 0; font-size: 14px; line-height: 1.6">{{a.tekst}}</p></sc-for>
</section>
<section aria-label="Spotkania i opieka" style="background: #003C60; color: #FFFFFF; padding: 16px 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; opacity: .85">Spotkania</span><span style="font-size: 15px; font-weight: 900">{{ref.ust.spotkania_termin}}</span><span style="font-size: 12px; opacity: .9">{{ref.ust.spotkania_miejsce}}</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; opacity: .85">Opiekun</span><span style="font-size: 15px; font-weight: 900">{{ref.ust.opiekun}}</span><span style="font-size: 12px; opacity: .9">Lider: {{ref.ust.lider}}</span></div>
</section>

</div>
</div>
</template>
<div id="root"></div>
<script src="/tresci.js"></script>
<script src="/runtime.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#BD4F38' };
}
}
SZ.mount(Component, {"mobile":null,"desktop":"/Wspolnota"});
</script>
</body>
</html>
