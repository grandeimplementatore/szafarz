<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#A9442F">
<title>Szafarz 3.0</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Szafarz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fondamento&amp;family=Lato:ital,wght@0,400;0,700;0,900;1,400&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#BD4F38}a:hover{color:#9A3E2B}
</style>
</head>
<body>
<template id="tpl">

<div style="position: relative; width: 100%; max-width: 640px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F0F0F0; font-family: 'Lato', system-ui, sans-serif; color: #333333; display: flex; flex-direction: column; overflow: hidden">

<header style="background: {{accent}}; color: #FFFFFF; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px; min-width: 0">
<svg aria-hidden="true" width="30" height="34" viewBox="0 0 24 27" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 1v5M9.8 3.2h4.4"></path><path d="M4 26V14a8 8 0 0 1 16 0v12"></path><path d="M9 26v-6a3 3 0 0 1 6 0v6"></path><path d="M2 26h20"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 15px; line-height: 1.2">Wspólnota Szafarzy Nadzwyczajnych Komunii&nbsp;Świętej</span>
<span style="font-size: 11px; line-height: 1.3; opacity: .92">Parafia bł. Karoliny Kózkówny w Tychach</span>
</div>
</div>
<button type="button" aria-label="Otwórz menu" aria-expanded="{{menuOpen}}" aria-controls="menu-m" onClick="{{openMenu}}" style="cursor: pointer; flex: none; width: 44px; height: 44px; border: 1px solid rgba(255,255,255,.5); border-radius: 6px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</button>
</header>

<section aria-label="Kościół bł. Karoliny Kózkówny" style="position: relative; height: 240px; overflow: hidden; background: #2B3643; flex: none">
<img src="/img/kosciol.jpg" alt="Kościół bł. Karoliny Kózkówny w Tychach z lotu ptaka" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%">
<div style="position: absolute; inset: 0; background: rgba(20,24,30,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #FFFFFF; padding: 0 20px 34px; gap: 8px">
<div style="font-family: 'Fondamento', Georgia, serif; font-size: 26px; line-height: 1.12; text-shadow: 0 2px 12px rgba(0,0,0,.55)">Wspólnota Szafarzy Nadzwyczajnych Komunii&nbsp;Świętej</div>
<div style="font-family: 'Fondamento', Georgia, serif; font-size: 16px; line-height: 1.2; text-shadow: 0 2px 8px rgba(0,0,0,.6)">Parafia Błogosławionej Karoliny Kózkówny w Tychach</div>
</div>
</section>

<div style="padding: 18px 14px 20px; position: relative; display: flex; flex-direction: column; gap: 14px">

<section aria-labelledby="posluga-m" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="posluga-m" style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 24px; color: {{accent}}">Twoja posługa</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="/KalendarzTelefon" style="min-height: 136px; box-sizing: border-box; padding: 16px 10px; background: #FFFFFF; border: 1px solid #DDDDDD; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px">
<svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18M8 14h2M14 14h2M8 17.5h2"></path></svg>
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 16px; line-height: 1.2; text-transform: uppercase; color: #3F3F3F">Harmonogram</span></a>
<a href="/PlannerTelefon" style="min-height: 136px; box-sizing: border-box; padding: 16px 10px; background: #FFFFFF; border: 1px solid #DDDDDD; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px">
<svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18M12 13v5M9.5 15.5h5"></path></svg>
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 16px; line-height: 1.2; text-transform: uppercase; color: #3F3F3F">Planner wizyt</span></a>
<a href="/ChorzyTelefon" style="min-height: 136px; box-sizing: border-box; padding: 16px 10px; background: #FFFFFF; border: 1px solid #DDDDDD; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px">
<svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"></path><path d="M5 9.5V20h14V9.5"></path><path d="M12 17.5s-3.2-1.9-3.2-4a1.7 1.7 0 0 1 3.2-.8 1.7 1.7 0 0 1 3.2.8c0 2.1-3.2 4-3.2 4z"></path></svg>
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 16px; line-height: 1.2; text-transform: uppercase; color: #3F3F3F">Nasi Chorzy</span></a>
<a href="/ObrzedTelefon" style="min-height: 136px; box-sizing: border-box; padding: 16px 10px; background: #FFFFFF; border: 1px solid #DDDDDD; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px">
<svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="2.6"></circle><path d="M6 9.5h12c0 3.8-2.7 6.3-6 6.3s-6-2.5-6-6.3z"></path><path d="M12 15.8V20M8.5 20.5h7"></path></svg>
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 16px; line-height: 1.2; text-transform: uppercase; color: #3F3F3F">Obrzęd Komunii&nbsp;Świętej</span></a>
<a href="/WspolnotaTelefon" style="min-height: 136px; box-sizing: border-box; padding: 16px 10px; background: #FFFFFF; border: 1px solid #DDDDDD; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px">
<svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><circle cx="17" cy="9" r="2.6"></circle><path d="M15.6 14.3A5 5 0 0 1 21 19"></path></svg>
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 16px; line-height: 1.2; text-transform: uppercase; color: #3F3F3F">Nasza Wspólnota</span></a>
<a href="/UstawieniaTelefon" style="min-height: 136px; box-sizing: border-box; padding: 16px 10px; background: #FFFFFF; border: 1px solid #DDDDDD; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px">
<svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 16px; line-height: 1.2; text-transform: uppercase; color: #3F3F3F">Ustawienia</span></a>
</div>
</section>

<section aria-labelledby="wizyty-m" style="background: #FFFFFF; padding: 20px 18px; display: flex; flex-direction: column; gap: 10px">
<h2 id="wizyty-m" style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 18px; text-transform: uppercase; letter-spacing: 0.03em; color: #3F3F3F">Najbliższe wizyty</h2>
<div style="background: #003C60; color: #FFFFFF; padding: 10px 14px; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; font-weight: 900">{{nextHead.date}}</span>
<span style="font-size: 12px; opacity: .9">{{nextHead.name}}</span>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{visitRows}}" as="r" hint-placeholder-count="4">
<a href="/PlannerTelefon" onClick="{{r.go}}" aria-label="Zaplanuj osiedle {{r.os}}: {{r.who}}, {{r.cnt}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 2px; border-bottom: {{r.border}}; text-decoration: none; color: #222222">
<span style="flex: none; width: 40px; height: 40px; border-radius: 7px; background: #E8EEF3; color: #003C60; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900">{{r.os}}</span>
<span style="flex: 1; display: inline-flex; align-items: center; font-size: 15px; font-weight: 700">{{r.who}}<sc-if value="{{r.changed}}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Zmieniono szafarza" title="Zmieniono szafarza (zmiana w harmonogramie)" style="flex: none; align-self: center; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; margin-left: 4px; border-radius: 50%; background: #FBE1BE; border: 1px solid #E8A24A; color: #A85600; font-size: 11px; font-weight: 900; line-height: 1">!</span></sc-if></span>
<span style="font-size: 12px; font-weight: 700; color: #003C60; background: #E8EEF3; padding: 3px 8px; border-radius: 999px">{{r.cnt}}</span>
<span aria-hidden="true" style="font-size: 18px; font-weight: 900; color: {{accent}}">›</span>
</a>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="/PlannerTelefon" style="display: flex; align-items: center; justify-content: center; min-height: 44px; background: #003C60; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none">Planner</a>
<a href="/KalendarzTelefon" style="display: flex; align-items: center; justify-content: center; min-height: 44px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none">Harmonogram</a>
</div>
</section>

<section aria-labelledby="slowo-m" style="background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 8px">
<h2 id="slowo-m" style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 18px; text-transform: uppercase; letter-spacing: 0.03em; color: #3F3F3F">Słowo na dziś</h2>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #555555"><span aria-hidden="true" style="flex: none; width: 9px; height: 9px; border-radius: 50%; background: {{lit.dayColor}}; display: inline-block"></span><span><b style="color: #222222">{{lit.dayShort}}</b> · {{lit.dayName}}</span></span>
<sc-if value="{{lit.hasQuote}}" hint-placeholder-val="{{ true }}">
<blockquote style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-size: 16px; line-height: 1.45; color: #2A2A2A">{{lit.quote}} <span style="font-family: 'Lato', sans-serif; font-style: normal; font-size: 13px; font-weight: 700; color: {{accent}}">{{lit.quoteRef}}</span></blockquote>
<div style="font-size: 12px; color: #5D5D5D">{{lit.sigLine}}</div>
</sc-if>
<sc-if value="{{lit.noQuote}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #444444">Czytania i Ewangelia na ten dzień są w serwisie Archidiecezji Katowickiej.</p>
</sc-if>
<a href="{{lit.url}}" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid {{accent}}; color: {{accent}}; font-size: 14px; font-weight: 700; text-decoration: none">Czytaj czytania »</a>
</section>

</div>

<footer style="margin-top: auto; background: #003C60; color: #FFFFFF; padding: 18px 16px; font-size: 12px; line-height: 1.5; text-align: center">
<div style="font-family: 'Fondamento', Georgia, serif; font-size: 15px">Wspólnota Szafarzy Nadzwyczajnych Komunii&nbsp;Świętej</div>
<div style="opacity: .85">Parafia Błogosławionej Karoliny Kózkówny w Tychach</div>
</footer>


<sc-if value="{{isMenu}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column">
<nav id="menu-m" aria-label="Menu" style="background: #FFFFFF; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; flex-direction: column">
<div style="background: {{accent}}; color: #FFFFFF; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 22px">Menu</span>
<button type="button" aria-label="Zamknij menu" onClick="{{closeMenu}}" style="flex: none; width: 44px; height: 44px; border: 1px solid rgba(255,255,255,.5); border-radius: 6px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<a href="/KalendarzTelefon" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 18px; border-bottom: 1px solid #EEEEEE; color: #222222; text-decoration: none; font-size: 17px; font-weight: 700">
<span style="flex: none; width: 40px; height: 40px; border-radius: 10px; background: #F3F3F3; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18M8 14h2M14 14h2M8 17.5h2"></path></svg></span>
<span style="flex: 1; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 19px">Harmonogram</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<a href="/PlannerTelefon" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 18px; border-bottom: 1px solid #EEEEEE; color: #222222; text-decoration: none; font-size: 17px; font-weight: 700">
<span style="flex: none; width: 40px; height: 40px; border-radius: 10px; background: #F3F3F3; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18M12 13v5M9.5 15.5h5"></path></svg></span>
<span style="flex: 1; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 19px">Planner wizyt</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<a href="/ChorzyTelefon" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 18px; border-bottom: 1px solid #EEEEEE; color: #222222; text-decoration: none; font-size: 17px; font-weight: 700">
<span style="flex: none; width: 40px; height: 40px; border-radius: 10px; background: #F3F3F3; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"></path><path d="M5 9.5V20h14V9.5"></path><path d="M12 17.5s-3.2-1.9-3.2-4a1.7 1.7 0 0 1 3.2-.8 1.7 1.7 0 0 1 3.2.8c0 2.1-3.2 4-3.2 4z"></path></svg></span>
<span style="flex: 1; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 19px">Nasi Chorzy</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<a href="/ObrzedTelefon" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 18px; border-bottom: 1px solid #EEEEEE; color: #222222; text-decoration: none; font-size: 17px; font-weight: 700">
<span style="flex: none; width: 40px; height: 40px; border-radius: 10px; background: #F3F3F3; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="2.6"></circle><path d="M6 9.5h12c0 3.8-2.7 6.3-6 6.3s-6-2.5-6-6.3z"></path><path d="M12 15.8V20M8.5 20.5h7"></path></svg></span>
<span style="flex: 1; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 19px">Obrzęd Komunii&nbsp;Świętej</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<a href="/WspolnotaTelefon" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 18px; border-bottom: 1px solid #EEEEEE; color: #222222; text-decoration: none; font-size: 17px; font-weight: 700">
<span style="flex: none; width: 40px; height: 40px; border-radius: 10px; background: #F3F3F3; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><circle cx="17" cy="9" r="2.6"></circle><path d="M15.6 14.3A5 5 0 0 1 21 19"></path></svg></span>
<span style="flex: 1; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 19px">Nasza Wspólnota</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
