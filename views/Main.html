<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#A9442F">
<title>Szafarz 3.0</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Szafarz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fondamento&amp;family=Lato:ital,wght@0,400;0,700;0,900;1,400&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F0F0F0}
a{color:#BD4F38}a:hover{color:#9A3E2B}
.nav a:hover{background:rgba(0,0,0,.12)}
.btn:hover{filter:brightness(.9)}
.tile:hover{box-shadow:0 10px 26px rgba(0,0,0,.10)}
</style>
</head>
<body>
<template id="tpl">

<div style="background: #F0F0F0; font-family: 'Lato', system-ui, sans-serif; color: #333333; min-height: 100vh">

<div style="background: #A9442F; color: #FFFFFF; font-size: 13px">
<div style="max-width: 1200px; margin: 0 auto; padding: 8px 20px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px">
<span style="font-weight: 700">{{lit.dateLabel}}</span>
<span>Szczęść Boże! · {{lit.dayName}}</span>
</div>
</div>

<header style="background: {{accent}}; color: #FFFFFF">
<div style="max-width: 1200px; margin: 0 auto; padding: 16px 20px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px">
<a href="#start" style="flex: 1 1 auto; display: flex; align-items: center; gap: 14px; color: #FFFFFF; text-decoration: none">
<svg aria-hidden="true" width="46" height="52" viewBox="0 0 24 27" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 1v5M9.8 3.2h4.4"></path><path d="M4 26V14a8 8 0 0 1 16 0v12"></path><path d="M9 26v-6a3 3 0 0 1 6 0v6"></path><path d="M2 26h20"></path></svg>
<span style="display: flex; flex-direction: column; gap: 3px">
<span style="font-family: 'Fondamento', Georgia, serif; font-size: clamp(16px, 1.5vw, 20px); line-height: 1.15; white-space: nowrap">Wspólnota Szafarzy Nadzwyczajnych Komunii&nbsp;Świętej</span>
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 16px; line-height: 1.2">Parafia Błogosławionej Karoliny Kózkówny w Tychach</span>
<span style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; opacity: .9">Archidiecezja Katowicka</span>
</span>
</a>
<nav class="nav" aria-label="Menu główne" style="display: flex; flex-wrap: wrap; gap: 4px">
<a href="/Kalendarz" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 44px; padding: 8px 10px; border-radius: 6px; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>Harmonogram</a>
<a href="/Planner" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 44px; padding: 8px 10px; border-radius: 6px; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18M12 13v5M9.5 15.5h5"></path></svg>Planner</a>
<a href="/Chorzy" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 44px; padding: 8px 10px; border-radius: 6px; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"></path><path d="M5 9.5V20h14V9.5"></path></svg>Nasi Chorzy</a>
<a href="/Obrzed" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 44px; padding: 8px 10px; border-radius: 6px; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="2.6"></circle><path d="M6 9.5h12c0 3.8-2.7 6.3-6 6.3s-6-2.5-6-6.3z"></path><path d="M12 15.8V20M8.5 20.5h7"></path></svg>Obrzęd</a>
<a href="/Wspolnota" style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 44px; padding: 8px 10px; border-radius: 6px; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><circle cx="17" cy="9" r="2.6"></circle><path d="M15.6 14.3A5 5 0 0 1 21 19"></path></svg>Nasza Wspólnota</a>
</nav>
</div>
</header>

<section aria-label="Kościół bł. Karoliny Kózkówny" style="position: relative; height: 440px; overflow: hidden; background: #2B3643">
<img src="/img/kosciol.jpg" alt="Kościół bł. Karoliny Kózkówny w Tychach z lotu ptaka" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%">
<div style="position: absolute; inset: 0; background: rgba(20,24,30,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #FFFFFF; padding: 0 24px 60px; gap: 12px">
<h1 style="margin: 0; max-width: 900px; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: clamp(32px, 4.4vw, 54px); line-height: 1.1; text-shadow: 0 2px 14px rgba(0,0,0,.5)">Wspólnota Szafarzy Nadzwyczajnych Komunii&nbsp;Świętej</h1>
<div style="font-family: 'Fondamento', Georgia, serif; font-size: clamp(19px, 2.2vw, 26px); line-height: 1.2; text-shadow: 0 2px 10px rgba(0,0,0,.55)">Parafia Błogosławionej Karoliny Kózkówny w Tychach</div>
<div style="font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; text-shadow: 0 1px 6px rgba(0,0,0,.6)">Archidiecezja Katowicka</div>
</div>
</section>

<main style="max-width: 1200px; margin: -70px auto 0; padding: 0 20px 48px; box-sizing: border-box; position: relative; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px">

<div style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px">

<section aria-labelledby="posluga" style="display: flex; flex-direction: column; gap: 18px">
<h2 id="posluga" style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 34px; color: {{accent}}">Twoja posługa</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px">

<a class="tile" href="/Kalendarz" style="box-sizing: border-box; padding: 26px 22px; background: #FFFFFF; border: 1px solid #DDDDDD; text-decoration: none; color: #333333; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px">
<svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18M8 14h2M14 14h2M8 17.5h2"></path></svg>
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 20px; text-transform: uppercase; letter-spacing: 0.04em; color: #3F3F3F">Harmonogram</span>
<span style="font-size: 14px; line-height: 1.5; color: #555555">Terminy odwiedzin chorych i przydział szafarzy do osiedli.</span>
<span style="margin-top: auto; display: inline-flex; align-items: center; justify-content: center; min-height: 40px; min-width: 120px; padding: 0 18px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 700">Otwórz »</span>
</a>

<a class="tile" href="/Planner" style="box-sizing: border-box; padding: 26px 22px; background: #FFFFFF; border: 1px solid #DDDDDD; text-decoration: none; color: #333333; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px">
<svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18M12 13v5M9.5 15.5h5"></path></svg>
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 20px; text-transform: uppercase; letter-spacing: 0.04em; color: #3F3F3F">Planner wizyt</span>
<span style="font-size: 14px; line-height: 1.5; color: #555555">Zaplanuj, których chorych odwiedzić w wybranym terminie.</span>
<span style="margin-top: auto; display: inline-flex; align-items: center; justify-content: center; min-height: 40px; min-width: 120px; padding: 0 18px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 700">Otwórz »</span>
</a>

<a class="tile" href="/Chorzy" style="box-sizing: border-box; padding: 26px 22px; background: #FFFFFF; border: 1px solid #DDDDDD; text-decoration: none; color: #333333; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px">
<svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"></path><path d="M5 9.5V20h14V9.5"></path><path d="M12 17.5s-3.2-1.9-3.2-4a1.7 1.7 0 0 1 3.2-.8 1.7 1.7 0 0 1 3.2.8c0 2.1-3.2 4-3.2 4z"></path></svg>
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 20px; text-transform: uppercase; letter-spacing: 0.04em; color: #3F3F3F">Nasi Chorzy</span>
<span style="font-size: 14px; line-height: 1.5; color: #555555">Osoby przyjmujące Komunię w domu, według osiedli.</span>
<span style="margin-top: auto; display: inline-flex; align-items: center; justify-content: center; min-height: 40px; min-width: 120px; padding: 0 18px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 700">Otwórz »</span>
</a>

<a class="tile" href="/Obrzed" style="box-sizing: border-box; padding: 26px 22px; background: #FFFFFF; border: 1px solid #DDDDDD; text-decoration: none; color: #333333; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px">
<svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="2.6"></circle><path d="M6 9.5h12c0 3.8-2.7 6.3-6 6.3s-6-2.5-6-6.3z"></path><path d="M12 15.8V20M8.5 20.5h7"></path></svg>
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 20px; text-transform: uppercase; letter-spacing: 0.04em; color: #3F3F3F">Obrzęd Komunii&nbsp;Świętej</span>
<span style="font-size: 14px; line-height: 1.5; color: #555555">Przebieg obrzędu i modlitwy przy Komunii chorych.</span>
<span style="margin-top: auto; display: inline-flex; align-items: center; justify-content: center; min-height: 40px; min-width: 120px; padding: 0 18px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 700">Otwórz »</span>
</a>

<a class="tile" href="/Wspolnota" style="box-sizing: border-box; padding: 26px 22px; background: #FFFFFF; border: 1px solid #DDDDDD; text-decoration: none; color: #333333; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px">
<svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><circle cx="17" cy="9" r="2.6"></circle><path d="M15.6 14.3A5 5 0 0 1 21 19"></path></svg>
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 20px; text-transform: uppercase; letter-spacing: 0.04em; color: #3F3F3F">Nasza Wspólnota</span>
<span style="font-size: 14px; line-height: 1.5; color: #555555">Szafarze parafii, kontakty, ogłoszenia i formacja.</span>
<span style="margin-top: auto; display: inline-flex; align-items: center; justify-content: center; min-height: 40px; min-width: 120px; padding: 0 18px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 700">Otwórz »</span>
</a>
<a class="tile" href="/Ustawienia" style="box-sizing: border-box; padding: 26px 22px; background: #FFFFFF; border: 1px solid #DDDDDD; text-decoration: none; color: #333333; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px">
<svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
<span style="font-family: 'Fondamento', Georgia, serif; font-size: 20px; text-transform: uppercase; letter-spacing: 0.04em; color: #3F3F3F">Ustawienia</span>
<span style="font-size: 14px; line-height: 1.5; color: #555555">Lista szafarzy, osiedla i terminy harmonogramu.</span>
<span style="margin-top: auto; display: inline-flex; align-items: center; justify-content: center; min-height: 40px; min-width: 120px; padding: 0 18px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 700">Otwórz »</span>
</a>

</div>
</section>
</div>

<aside aria-label="Panel boczny" style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<section aria-labelledby="wizyty" style="background: #FFFFFF; padding: 28px 24px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px">
<svg aria-hidden="true" width="50" height="50" viewBox="0 0 24 24" fill="#5D5D5D"><path d="M12 2.2 2.5 9.4l1.2 1.6L5 10v10.5h5v-5.2h4v5.2h5V10l1.3 1 1.2-1.6zM11.2 5.2h1.6v1.6h1.6v1.6h-1.6V10h-1.6V8.4H9.6V6.8h1.6z"></path></svg>
<h2 id="wizyty" style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 21px; text-transform: uppercase; letter-spacing: 0.04em; color: #3F3F3F; text-align: center">Najbliższe wizyty</h2>
<div style="text-align: center; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 900; color: #222222">{{nextHead.date}}</span>
<span style="font-size: 13px; color: #5D5D5D">{{nextHead.name}} · odwiedziny chorych</span>
</div>
<div style="align-self: stretch; display: flex; flex-direction: column; border-top: 1px solid #E5E5E5">
<sc-for list="{{visitRows}}" as="r" hint-placeholder-count="4">
<a href="/Planner" onClick="{{r.go}}" aria-label="Zaplanuj osiedle {{r.os}}: {{r.who}}, {{r.cnt}}" style="display: flex; align-items: center; gap: 14px; padding: 10px 2px; border-bottom: {{r.border}}; text-decoration: none">
<span style="flex: none; width: 44px; height: 44px; border-radius: 8px; background: #003C60; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900">{{r.os}}</span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: #5D5D5D">{{r.sub}}</span><span style="display: inline-flex; align-items: center; font-size: 16px; font-weight: 700; color: #222222">{{r.who}}<sc-if value="{{r.changed}}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Zmieniono szafarza" title="Zmieniono szafarza (zmiana w harmonogramie)" style="flex: none; align-self: center; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; margin-left: 4px; border-radius: 50%; background: #FBE1BE; border: 1px solid #E8A24A; color: #A85600; font-size: 11px; font-weight: 900; line-height: 1">!</span></sc-if></span></span>
<span aria-hidden="true" style="font-size: 18px; font-weight: 900; color: {{accent}}">›</span>
</a>
</sc-for>
</div>
<div style="align-self: stretch; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a class="btn" href="/Planner" style="display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 12px; background: #003C60; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none">Planner</a>
<a class="btn" href="/Kalendarz" style="display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 12px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none">Harmonogram</a>
</div>
</section>
<section aria-labelledby="slowo" style="background: #FFFFFF; padding: 28px 24px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px">
<svg aria-hidden="true" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#5D5D5D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 3 5v13c4-.5 7 0 9 1.5 2-1.5 5-2 9-1.5V5c-4-.5-7 0-9 1.5z"></path><path d="M12 6.5v13"></path></svg>
<h2 id="slowo" style="margin: 0; font-family: 'Fondamento', Georgia, serif; font-weight: 400; font-size: 21px; text-transform: uppercase; letter-spacing: 0.04em; color: #3F3F3F; text-align: center">Słowo na dziś</h2>
<span style="font-size: 14px; font-weight: 700; color: #222222; text-align: center">{{lit.dateLabel}}</span>
<span style="display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: #555555; text-align: center"><span aria-hidden="true" style="flex: none; width: 9px; height: 9px; border-radius: 50%; background: {{lit.dayColor}}; display: inline-block"></span>{{lit.dayName}}</span>
<sc-if value="{{lit.hasQuote}}" hint-placeholder-val="{{ true }}">
<blockquote style="margin: 4px 0 0; font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-size: 18px; line-height: 1.45; color: #2A2A2A; text-align: center">{{lit.quote}}</blockquote>
<div style="font-size: 14px; font-weight: 700; color: {{accent}}">{{lit.quoteRef}}</div>
</sc-if>
<sc-if value="{{lit.hasRows}}" hint-placeholder-val="{{ true }}">
<div style="align-self: stretch; display: flex; flex-direction: column; border-top: 1px solid #E5E5E5; font-size: 14px">
<sc-for list="{{lit.rows}}" as="z" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: {{z.border}}"><span style="color: #5D5D5D; flex: none">{{z.label}}</span><span style="font-weight: 700; text-align: right">{{z.sig}}</span></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{lit.noQuote}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #444444; text-align: center">Czytania i Ewangelia na ten dzień są w serwisie Archidiecezji Katowickiej.</p>
</sc-if>
<a class="btn" href="{{lit.url}}" target="_blank" rel="noopener" style="align-self: stretch; display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none">Czytaj czytania »</a>

  dateLabel: WDF[wd] + ', ' + D + ' ' + GEN[M - 1] + ' ' + Y,
