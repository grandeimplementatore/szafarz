<script src="/runtime.js"></script>
<script>
const LIT_MAKE = () => {
const now = new Date();
const Y = now.getFullYear(), M = now.getMonth() + 1, D = now.getDate();
const dn = (y, m, d) => Math.round(Date.UTC(y, m - 1, d) / 864e5);
const wdOf = (x) => new Date(x * 864e5).getUTCDay();
const x = dn(Y, M, D), wd = wdOf(x);
const WDF = ['Niedziela', 'Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek', 'Sobota'];
const GEN = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia'];
const ROM = (n) => { const v = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let r = ''; v.forEach(([k, s]) => { while (n >= k) { r += s; n -= k; } }); return r; };
const easter = (y) => { const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451); const mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1; return dn(y, mo, da); };
const advent1 = (y) => { const c = dn(y, 12, 25); const w = wdOf(c); return c - (w === 0 ? 7 : w) - 21; };
const E = easter(Y), ash = E - 46, pent = E + 49, adv = advent1(Y);
const ep = dn(Y, 1, 6), bapt = ep + (7 - wdOf(ep));
const sun = x - wd;
const GREEN = '#2E7D4F', VIOLET = '#6B3FA0', WHITE = '#C9A227', RED = '#B3261E';
let name = '', color = GREEN, sunday = wd === 0, privileged = false;
if (x >= adv && x < dn(Y, 12, 25)) {
  const w = Math.floor((sun - adv) / 7) + 1; color = VIOLET; privileged = true;
  name = sunday ? ROM(w) + ' Niedziela Adwentu' : WDF[wd] + ' ' + ROM(w) + ' tygodnia Adwentu';
} else if (x >= dn(Y, 12, 25) || x <= bapt) {
  color = WHITE;
  const hf = (() => { for (let k = dn(Y, 12, 26); k <= dn(Y, 12, 31); k++) if (wdOf(k) === 0) return k; return dn(Y, 12, 30); })();
  if (x === bapt) name = 'Święto Chrztu Pańskiego';
  else if (x >= dn(Y, 12, 25) && x === hf) name = 'Święto Świętej Rodziny: Jezusa, Maryi i Józefa';
  else if (x > dn(Y, 12, 25)) name = WDF[wd] + ' w oktawie Narodzenia Pańskiego';
  else name = sunday ? 'II Niedziela po Narodzeniu Pańskim' : WDF[wd] + ' okresu Narodzenia Pańskiego';
} else if (x < ash) {
  const w = Math.floor((sun - bapt) / 7) + 1;
  name = sunday ? ROM(w) + ' Niedziela zwykła' : WDF[wd] + ' ' + ROM(w) + ' tygodnia zwykłego';
} else if (x < E) {
  color = VIOLET; privileged = true;
  const lent1 = ash + 4;
  if (x === ash) name = 'Środa Popielcowa';
  else if (x < lent1) name = WDF[wd] + ' po Popielcu';
  else if (x === E - 7) { name = 'Niedziela Palmowa Męki Pańskiej'; color = RED; }
  else if (x > E - 7) { name = ['', 'Wielki Poniedziałek', 'Wielki Wtorek', 'Wielka Środa', 'Wielki Czwartek', 'Wielki Piątek', 'Wielka Sobota'][wd]; if (wd === 5) color = RED; if (wd === 4) color = WHITE; }
  else { const w = Math.floor((sun - lent1) / 7) + 1; name = sunday ? ROM(w) + ' Niedziela Wielkiego Postu' : WDF[wd] + ' ' + ROM(w) + ' tygodnia Wielkiego Postu'; }
} else if (x <= pent) {
  color = WHITE; privileged = true;
  const w = Math.floor((sun - E) / 7) + 1;
  if (x === E) name = 'Niedziela Zmartwychwstania Pańskiego';
  else if (x < E + 7) name = WDF[wd] + ' w oktawie Wielkanocy';
  else if (x === E + 7) name = 'II Niedziela Wielkanocna, czyli Miłosierdzia Bożego';
  else if (x === E + 42) name = 'Uroczystość Wniebowstąpienia Pańskiego';
  else if (x === pent) { name = 'Uroczystość Zesłania Ducha Świętego'; color = RED; }
  else name = sunday ? ROM(w) + ' Niedziela Wielkanocna' : WDF[wd] + ' ' + ROM(w) + ' tygodnia wielkanocnego';
} else {
  const w = 35 - (adv - sun) / 7;
  if (x === adv - 7) { name = 'Uroczystość Jezusa Chrystusa, Króla Wszechświata'; color = WHITE; }
  else if (x === pent + 1) { name = 'Święto Najświętszej Maryi Panny, Matki Kościoła'; color = WHITE; }
  else if (x === pent + 7) { name = 'Uroczystość Najświętszej Trójcy'; color = WHITE; }
  else if (x === pent + 11) { name = 'Uroczystość Najświętszego Ciała i Krwi Chrystusa'; color = WHITE; }
  else if (x === pent + 19) { name = 'Uroczystość Najświętszego Serca Pana Jezusa'; color = WHITE; }
  else name = sunday ? ROM(w) + ' Niedziela zwykła' : WDF[wd] + ' ' + ROM(w) + ' tygodnia zwykłego';
}
const FIXED = Object.fromEntries(SZ.ref.swieta.map((s) => [s.m + '-' + s.d, [s.nazwa, { bialy: WHITE, czerwony: RED, fioletowy: VIOLET, zielony: GREEN }[s.kolor] || WHITE, s.ranga]]));
const fx = FIXED[M + '-' + D];
const holyWeek = x >= E - 7 && x <= E + 7;
if (fx && !holyWeek && !(sunday && privileged) && !(sunday && fx[2] === 'F')) { name = fx[0]; color = fx[1]; }
const iso = Y + '-' + String(M).padStart(2, '0') + '-' + String(D).padStart(2, '0');
const READ = SZ.ref.slowo;
const r = READ[iso];
const rows = r ? r[2].map((z, k) => ({ label: z[0], sig: z[1], border: k < r[2].length - 1 ? '1px solid #E5E5E5' : '0' })) : [];
return {
  dateLabel: WDF[wd] + ', ' + D + ' ' + GEN[M - 1] + ' ' + Y,
  dayName: name, dayColor: color,
  hasQuote: !!r, noQuote: !r,
  quote: r ? '„' + r[0] + '”' : '', quoteRef: r ? r[1] : '',
  rows, hasRows: rows.length > 0, sigLine: rows.map((z) => z.sig).join(' · '),
  url: 'https://www.archidiecezjakatowicka.pl/slowo-na-dzisiaj?data=' + String(D).padStart(2, '0') + '-' + String(M).padStart(2, '0') + '-' + Y,
  dayShort: D + ' ' + GEN[M - 1]
};
};
class Component extends DCLogic {
renderVals() { return Object.assign({}, this._rv0(), { lit: LIT_MAKE() }); }
_rv0() {
return { accent: this.props.accent ?? '#BD4F38' };
}
}
SZ.mount(Component, {"mobile":"/WspolnotaTelefon","desktop":null});
</script>
